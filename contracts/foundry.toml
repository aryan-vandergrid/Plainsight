[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
auto_detect_solc = true
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
fs_permissions = [
  { access = "read-write", path = "./addresses.json" },
  { access = "read-write", path = "../web/lib/addresses.json" },
  { access = "read-write", path = "./compare.json" },
  { access = "read-write", path = "../web/lib/compare.json" },
  { access = "read", path = "./out" },
]

additional_compiler_profiles = [
  { name = "cca", via_ir = true, optimizer_runs = 11111 },
  { name = "permit2", via_ir = true, optimizer_runs = 1000000 },
  { name = "v4core", via_ir = true, optimizer_runs = 44444444 },
]
compilation_restrictions = [
  { paths = "lib/continuous-clearing-auction/src/**", via_ir = true, optimizer_runs = 11111 },
  { paths = "lib/continuous-clearing-auction/lib/permit2/src/**", via_ir = true, optimizer_runs = 1000000 },
  { paths = "lib/continuous-clearing-auction/lib/v4-periphery/lib/v4-core/src/PoolManager.sol", via_ir = true, optimizer_runs = 44444444 },
]

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"

[fmt]
line_length = 120

[lint]
lint_on_build = false
